# Azure DevOps Pipeline for AVD Host Pool Deployment
# This pipeline deploys the Azure Virtual Desktop (AVD) host pool infrastructure

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - infra/avd.bicep
    - infra/avd.parameters.jsonc
    - infra/deploy-avd.ps1

variables:
  - name: resourceGroupName
    value: 'rg-opc-dev-001'
  - name: location
    value: 'australiaeast'
  - name: serviceConnectionName
    value: 'Azure-DevOps-Service-Connection' # Replace with your actual service connection name

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: ValidateAVD
  displayName: 'Validate AVD Infrastructure'
  jobs:
  - job: ValidateDeployment
    displayName: 'Validate Bicep Template'
    steps:
    - checkout: self
    
    - task: AzureCLI@2
      displayName: 'Validate AVD Bicep Template'
      inputs:
        azureSubscription: '$(serviceConnectionName)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Validating AVD Bicep template..."
          
          # Check if resource group exists, create if not
          if ! az group show --name $(resourceGroupName) &> /dev/null; then
            echo "Creating resource group $(resourceGroupName) in $(location)..."
            az group create --name $(resourceGroupName) --location $(location)
          fi
          
          # Validate the deployment
          az deployment group validate \
            --resource-group $(resourceGroupName) \
            --template-file ./infra/avd.bicep \
            --parameters @./infra/avd.parameters.jsonc
          
          echo "Validation completed successfully"

- stage: DeployAVD
  displayName: 'Deploy AVD Infrastructure'
  dependsOn: ValidateAVD
  condition: succeeded()
  jobs:
  - deployment: DeployAVDInfrastructure
    displayName: 'Deploy AVD Host Pool'
    environment: 'Development'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          
          - task: AzureCLI@2
            displayName: 'Deploy AVD Infrastructure'
            inputs:
              azureSubscription: '$(serviceConnectionName)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Deploying AVD infrastructure..."
                
                # Check if resource group exists, create if not
                if ! az group show --name $(resourceGroupName) &> /dev/null; then
                  echo "Creating resource group $(resourceGroupName) in $(location)..."
                  az group create --name $(resourceGroupName) --location $(location)
                fi
                
                # Deploy the Bicep template
                az deployment group create \
                  --resource-group $(resourceGroupName) \
                  --template-file ./infra/avd.bicep \
                  --parameters @./infra/avd.parameters.jsonc \
                  --name "avd-deployment-$(Build.BuildNumber)"
                
                echo "AVD infrastructure deployment completed successfully"

          - task: AzureCLI@2
            displayName: 'Output Deployment Results'
            inputs:
              azureSubscription: '$(serviceConnectionName)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Getting deployment outputs..."
                az deployment group show \
                  --resource-group $(resourceGroupName) \
                  --name "avd-deployment-$(Build.BuildNumber)" \
                  --query properties.outputs